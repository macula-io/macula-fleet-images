# Every pin in this repository moves only by a reviewed change: dependabot proposes, weekly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Go modules caddy-linode is built from (go.mod + go.sum).
  - package-ecosystem: gomod
    directory: /images/caddy-linode
    schedule:
      interval: weekly
  # The builder and runtime images it is built on (pinned by digest in the Containerfile).
  - package-ecosystem: docker
    directory: /images/caddy-linode
    schedule:
      interval: weekly
  # searxng is a thin rebuild FROM upstream's index digest: a new SearXNG arrives as a proposal here.
  - package-ecosystem: docker
    directory: /images/searxng
    schedule:
      interval: weekly
  # hanko and timescaledb are thin rebuilds FROM upstream's index digest: a new release arrives as a
  # proposal here (hanko's version check stage is pinned too).
  - package-ecosystem: docker
    directory: /images/hanko
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /images/timescaledb
    schedule:
      interval: weekly
