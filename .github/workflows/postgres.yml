# Build ghcr.io/macula-io/postgres from images/postgres (a thin rebuild FROM upstream's pinned
# index digest), then sign it and attest its SBOM and provenance (macula-ci-images'
# attest-image.yml), so beam-campus.net runs a postgres our CI signed (macula-fleet#55).
#
# The fleet pins the image by DIGEST (vps/beam-campus-net/docker-compose.yml in macula-fleet): a
# build here changes no box until a reviewed pin commit moves. The tags are for readers only:
#   <postgres release>-alpine       the upstream release inside, e.g. 16.15-alpine
#   git-<full commit sha>           exactly which commit built it, never moved

name: postgres

on:
  push:
    branches: [main]
    paths:
      - 'images/postgres/**'
      - '.github/workflows/postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

# One build per ref: two quick pushes must not race to the same tags.
concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # REFUSED BEFORE ANYTHING IS PUSHED: a v* tag off the default branch (or off its
  # line's release-<major>.<minor> branch), or whose version is not the one this
  # repository publishes, stops here, so a refused tag leaves no image on the
  # registry. Any other ref passes. attest-image checks the same again before it
  # signs. Pinned by full commit sha, as the attest call is.
  guard:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe

  build:
    needs: guard
    # A build from any ref but the default branch is REFUSED (macula-fleet#55). workflow_dispatch
    # runs from ANY branch, release-guard passes every ref that is not a v* tag, and the fleet pins
    # and verifies a DIGEST without caring which ref built it -- so an unreviewed branch whose
    # Containerfile is FROM anything could push, be signed, and verify on a box.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The version tag is read from the FROM line the image is built from, so it cannot drift.
      - name: Tags
        id: tags
        run: |
          version=$(sed -n 's/^FROM docker\.io\/library\/postgres:\([0-9.]*-alpine\)@sha256:[0-9a-f]\{64\}$/\1/p' images/postgres/Containerfile)
          if [ -z "$version" ]; then
            echo "::error::cannot read the postgres tag from the Containerfile's FROM line"
            exit 1
          fi
          {
            echo "tags<<EOF"
            echo "ghcr.io/macula-io/postgres:${version}"
            echo "ghcr.io/macula-io/postgres:git-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/postgres
          file: images/postgres/Containerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            REVISION=${{ github.sha }}

  attest:
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@fa59fba58d1b65dce35f8613dcb257273a0f29ed
    with:
      image: ghcr.io/macula-io/postgres
      digest: ${{ needs.build.outputs.digest }}
