# Build ghcr.io/macula-io/timescaledb from images/timescaledb (a thin rebuild FROM upstream's
# pinned index digest), then sign it and attest its SBOM and provenance (macula-ci-images'
# attest-image.yml), so frankfurt runs a postgres our CI signed.
#
# The fleet pins the image by DIGEST (vps/macula-io/docker-compose.yml in macula-fleet): a build
# here changes no box until a reviewed pin commit moves. The tags are for readers only:
#   <timescaledb docker tag>        the upstream release inside, e.g. 2.29.2-pg16
#   git-<full commit sha>           exactly which commit built it, never moved

name: timescaledb

on:
  push:
    branches: [main]
    paths:
      - 'images/timescaledb/**'
      - '.github/workflows/timescaledb.yml'
  workflow_dispatch:

permissions:
  contents: read

# One build per ref: two quick pushes must not race to the same tags.
concurrency:
  group: timescaledb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The version tag is read from the FROM line the image is built from, so it cannot drift.
      - name: Tags
        id: tags
        run: |
          version=$(sed -n 's/^FROM docker\.io\/timescale\/timescaledb:\([0-9.]*-pg[0-9]*\)@sha256:[0-9a-f]\{64\}$/\1/p' images/timescaledb/Containerfile)
          if [ -z "$version" ]; then
            echo "::error::cannot read the timescaledb tag from the Containerfile's FROM line"
            exit 1
          fi
          {
            echo "tags<<EOF"
            echo "ghcr.io/macula-io/timescaledb:${version}"
            echo "ghcr.io/macula-io/timescaledb:git-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/timescaledb
          file: images/timescaledb/Containerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            REVISION=${{ github.sha }}

  attest:
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@601c719b7cfbd8ed15852281d87c652d776a6ae7
    with:
      image: ghcr.io/macula-io/timescaledb
      digest: ${{ needs.build.outputs.digest }}
