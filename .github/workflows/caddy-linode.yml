# Build ghcr.io/macula-io/caddy-linode from images/caddy-linode, then sign it and attest its
# SBOM and provenance (macula-ci-images' attest-image.yml), so a station runs only this caddy.
#
# The fleet pins the image by DIGEST (vps/*/station-config.env in macula-fleet): a build here
# changes no box until a reviewed pin commit moves. The tags are for readers only:
#   <caddy>-linode<module>          the versions inside, moved by a rebuild of the same versions
#   git-<full commit sha>           exactly which commit built it, never moved

name: caddy-linode

on:
  push:
    branches: [main]
    paths:
      - 'images/caddy-linode/**'
      - '.github/workflows/caddy-linode.yml'
  workflow_dispatch:

permissions:
  contents: read

# One build per ref: two quick pushes must not race to the same tags.
concurrency:
  group: caddy-linode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # REFUSED BEFORE ANYTHING IS PUSHED: a v* tag off the default branch (or off its
  # line's release-<major>.<minor> branch), or whose version is not the one this
  # repository publishes, stops here, so a refused tag leaves no image on the
  # registry. Any other ref passes. attest-image checks the same again before it
  # signs. Pinned by full commit sha, as the attest call is.
  guard:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe

  # THE STRUCTURAL FLOOR (macula-io/macula-codebase-checks#9): deep nesting and
  # tangled functions fail the build. The caps are spelled out in
  # images/caddy-linode/.golangci.yml, never taken from a tool default.
  lint:
    name: structural lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: images/caddy-linode/go.mod

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.15.0
          working-directory: images/caddy-linode
          args: --timeout 10m

  build:
    needs: [guard, lint]
    # A build from any ref but the default branch is REFUSED (macula-fleet#55). workflow_dispatch
    # runs from ANY branch, release-guard passes every ref that is not a v* tag, and the fleet pins
    # and verifies a DIGEST without caring which ref built it -- so an unreviewed branch whose
    # Containerfile is FROM anything could push, be signed, and verify on a box.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The version tag is read from what the image is built from, so it cannot drift from it.
      - name: Tags
        id: tags
        run: |
          caddy=$(sed -n 's/^\s*github.com\/caddyserver\/caddy\/v2 \(v[0-9.]*\)$/\1/p' images/caddy-linode/go.mod)
          linode=$(sed -n 's/^\s*github.com\/caddy-dns\/linode \(v[0-9.]*\)$/\1/p' images/caddy-linode/go.mod)
          if [ -z "$caddy" ] || [ -z "$linode" ]; then
            echo "::error::cannot read versions from go.mod"
            exit 1
          fi
          {
            echo "tags<<EOF"
            echo "ghcr.io/macula-io/caddy-linode:${caddy#v}-linode${linode#v}"
            echo "ghcr.io/macula-io/caddy-linode:git-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/caddy-linode
          file: images/caddy-linode/Containerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            REVISION=${{ github.sha }}

  attest:
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@fa59fba58d1b65dce35f8613dcb257273a0f29ed
    with:
      image: ghcr.io/macula-io/caddy-linode
      digest: ${{ needs.build.outputs.digest }}
